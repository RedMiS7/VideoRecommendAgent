[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-agent"
version = "0.1.0"
description = "A local learning-video recommender with persistent preferences and subtitle RAG"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "httpx>=0.27,<1", "jsonschema>=4.23,<5", "numpy>=2,<3",
  "python-dotenv>=1,<2", "tzdata>=2024.1",
  "bilibili-api-python==17.4.2", "mcp>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
video-agent = "video_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
